name: Deploy Game and Playground to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/playground/**'
      - 'apps/game-web/**'
      - 'packages/game-core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build game web
        run: pnpm --filter @bombcat/game-web build

      - name: Install playground dependencies
        working-directory: docs/playground
        run: npm ci

      - name: Build playground
        working-directory: docs/playground
        run: npm run build

      - name: Merge Pages artifact
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist/game
          cp -R docs/playground/dist/. pages-dist/
          cp -R apps/game-web/dist/. pages-dist/game/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
